openapi: 3.0.3
info:
  title: Crowdfunding Trading Platform API
  version: 1.0.0
  description: Share-based crowdfunding platform with role-based access control
paths:
  /api/v1/access-requests/:
    post:
      operationId: access_requests_create
      tags:
      - access-requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessRequestCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccessRequestCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccessRequestCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequestCreate'
          description: ''
  /api/v1/access-requests/admin/{id}/approve/:
    post:
      operationId: access_requests_admin_approve_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - access-requests
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequestActionResponse'
          description: ''
  /api/v1/access-requests/admin/{id}/reject/:
    post:
      operationId: access_requests_admin_reject_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - access-requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAccessRequestActionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminAccessRequestActionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminAccessRequestActionRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequestActionResponse'
          description: ''
  /api/v1/access-requests/admin/{id}/revoke/:
    post:
      operationId: access_requests_admin_revoke_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - access-requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAccessRequestActionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminAccessRequestActionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminAccessRequestActionRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequestActionResponse'
          description: ''
  /api/v1/access-requests/my/:
    get:
      operationId: access_requests_my_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - access-requests
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccessRequestListList'
          description: ''
  /api/v1/audit/admin/audit-logs/:
    get:
      operationId: audit_admin_audit_logs_list
      description: |-
        GET /admin/audit-logs/
        Admin-only view to list all audit logs.
        Supports pagination.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - audit
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/auth/google/:
    post:
      operationId: auth_google_create
      description: |-
        POST /api/v1/auth/google/

        Authenticate via Google OAuth.

        SRS Requirements:
        - OAuth support
        - Auto email verification
        - Returns JWT tokens
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleOAuthRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleOAuthRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleOAuthRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleOAuth'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        POST /api/v1/auth/login/

        Login with email and password.

        SRS Requirements:
        - Email and password authentication
        - Returns JWT access and refresh tokens
        - Works for all roles (Admin, Developer, Investor)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLogin'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        POST /api/v1/auth/logout/

        Logout user by blacklisting refresh token.

        SRS Requirements:
        - Secure logout
        - Session invalidation
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Logout'
          description: ''
  /api/v1/auth/password-reset/:
    post:
      operationId: auth_password_reset_create
      description: |-
        POST /api/v1/auth/password-reset/

        Request password reset via email.

        SRS Requirements:
        - Users can reset password
        - Reset link sent via email
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetRequest'
          description: ''
  /api/v1/auth/password-reset-confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: |-
        POST /api/v1/auth/password-reset-confirm/

        Confirm password reset with token and new password.

        SRS Requirements:
        - Secure password reset
        - Token validation
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetConfirm'
          description: ''
  /api/v1/auth/profile/:
    get:
      operationId: auth_profile_retrieve
      description: |-
        GET /api/v1/auth/profile/

        Get authenticated user's profile.

        SRS Requirements:
        - View own profile
        - Shows role and verification status
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: |-
        POST /api/v1/auth/register/

        Register new user (Developer or Investor).

        SRS Requirements:
        - Email, password, first_name, last_name required
        - Role selection (DEVELOPER or INVESTOR only)
        - Email verification sent after registration
        - Admin users created via backend only
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegistration'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/verify-email/:
    post:
      operationId: auth_verify_email_create
      description: |-
        POST /api/v1/auth/verify-email/

        Verify email using token sent via email.

        SRS Requirements:
        - Email verification required
        - Enables investment and restricted access features
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerification'
          description: ''
  /api/v1/dashboard/admin/:
