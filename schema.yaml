      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentTransaction'
          description: ''
  /api/v1/investments/initiate/:
    post:
      operationId: investments_initiate_create
      description: |-
        POST /api/v1/investments/initiate/

        Initiate investment process for an approved project.

        SRS Requirements:
        - Email verification required
        - Only approved projects
        - Share availability check
        - Idempotency support
      tags:
      - investments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiateInvestmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InitiateInvestmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InitiateInvestmentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitiateInvestment'
          description: ''
  /api/v1/investments/my/:
    get:
      operationId: investments_my_list
      description: |-
        GET /api/v1/investments/my/

        List all share purchases made by the authenticated investor.

        SRS Requirements:
        - Show investment history
        - Include project details
        - Ordered by most recent
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - investments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSharePurchaseListList'
          description: ''
  /api/v1/investments/payments/callback/:
    post:
      operationId: investments_payments_callback_create
      description: |-
        POST /api/v1/investments/payments/callback/

        Payment gateway webhook endpoint.
        Processes payment confirmations and creates share purchases.

        SRS Requirements:
        - Idempotent processing
        - Prevents duplicate callbacks
        - Atomic share allocation
        - Audit logging

        Note: This endpoint may need to allow unauthenticated requests
        from payment gateway. Implement proper signature verification
        in production.
      tags:
      - investments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCallbackRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentCallbackRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentCallbackRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCallback'
          description: ''
  /api/v1/investments/portfolio/summary/:
    get:
      operationId: investments_portfolio_summary_retrieve
      description: |-
        GET /api/v1/investments/portfolio/summary/

        Get investor's portfolio summary for dashboard.

        SRS Requirements:
        - Total invested amount
        - Number of projects invested
        - Total shares owned
        - Investment count
      tags:
      - investments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioSummary'
          description: ''
