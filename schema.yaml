      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - favorites
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/favorites/list/:
    get:
      operationId: favorites_list_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
