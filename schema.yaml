          description: ''
  /api/v1/investments/{id}/:
    get:
      operationId: investments_retrieve
      description: |-
        GET /api/v1/investments/{id}/

        Retrieve detailed information about a specific investment.
        Used for receipts and transaction details.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - investments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharePurchaseDetail'
          description: ''
  /api/v1/investments/admin/transactions/:
    get:
      operationId: investments_admin_transactions_list
      description: |-
        GET /api/v1/investments/admin/transactions/

        Admin view of all payment transactions for audit purposes.

        SRS Requirements:
        - Admin can review all transactions
        - Includes success and failures
        - Audit trail support
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - investments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPaymentTransactionList'
          description: ''
  /api/v1/investments/admin/transactions/{id}/:
    get:
      operationId: investments_admin_transactions_retrieve
      description: |-
        GET /api/v1/investments/admin/transactions/{id}/

        Admin view of individual payment transaction details.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
