  /api/v1/audit/admin/audit-logs/:
    get:
      operationId: audit_admin_audit_logs_list
      description: |-
        GET /admin/audit-logs/
        Admin-only view to list all audit logs.
        Supports pagination.
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor
        schema:
          type: string
          format: uuid
      - in: query
        name: entity_type
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - audit
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
              examples:
                AuditLogExample:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - id: e1f2a3b4-c5d6-4e5f-a6b7-c8d9e0f1a2b3
                      actor_email: admin@example.com
                      action: PROJECT_APPROVED
                      entity_type: PROJECT
                      entity_id: 71b7d9e6-f29a-46e0-9899-f0dd317403a7
                      metadata:
                        approved_at: '2026-01-20T10:00:00Z'
                      created_at: '2026-01-20T10:00:00Z'
                  summary: Audit Log Example
          description: ''
  /api/v1/auth/google/:
    post:
      operationId: auth_google_create
      description: |-
        POST /api/v1/auth/google/

        Authenticate via Google OAuth.

        SRS Requirements:
        - OAuth support
        - Auto email verification
        - Returns JWT tokens
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleOAuthRequest'
            examples:
              GoogleOAuthExample:
                value:
                  token: google-oauth-identity-token-string
                  role: INVESTOR
                summary: Google OAuth Example
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleOAuthRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleOAuthRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        POST /api/v1/auth/login/

        Login with email and password.

        SRS Requirements:
        - Email and password authentication
        - Returns JWT access and refresh tokens
        - Works for all roles (Admin, Developer, Investor)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                LoginSuccessExample:
                  value:
                    success: true
                    message: Login successful
                    data:
                      access: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                      refresh: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                      user:
                        email: investor@example.com
                        first_name: John
                        last_name: Doe
                        role: INVESTOR
                  summary: Login Success Example
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        POST /api/v1/auth/logout/

        Logout user by blacklisting refresh token.

