  schemas:
    AccessRequestActionResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
      - message
      - success
    AccessRequestCreate:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project:
          type: string
          format: uuid
        reason:
          type: string
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/AccessRequestStatus'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - project
      - status
