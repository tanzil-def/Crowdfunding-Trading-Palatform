    PaymentTransaction:
      type: object
      description: |-
        Serializer for payment transaction records.
        Used in admin panel and audit logs.

        SRS Requirements:
        - Admin can review all transactions
        - Includes success and failures
        - Audit trail support
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        reference_id:
          type: string
          readOnly: true
          description: Unique reference for idempotency and gateway tracking
        investor_email:
          type: string
          format: email
          readOnly: true
        project_title:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          description: Transaction amount (e.g. 5000.00)
        status:
          allOf:
          - $ref: '#/components/schemas/InvestmentStatus'
          readOnly: true
        has_share_purchase:
          type: boolean
          readOnly: true
        failure_reason:
          type: string
          readOnly: true
          description: Reason for payment failure if applicable
        created_at:
          type: string
          format: date-time
          readOnly: true
        processed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Timestamp when payment was confirmed or failed
      required:
      - amount
      - created_at
      - failure_reason
      - has_share_purchase
      - id
      - investor_email
      - processed_at
      - project_title
      - reference_id
      - status
