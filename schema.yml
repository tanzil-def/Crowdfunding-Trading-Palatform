      - access-requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAccessRequestActionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminAccessRequestActionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminAccessRequestActionRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequestActionResponse'
          description: ''
  /api/v1/access-requests/my/:
    get:
      operationId: access_requests_my_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - access-requests
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccessRequestListList'
              examples:
                AccessRequestListExample:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - id: b1a2c3d4-e5f6-4a5b-b6c7-d8e9f0a1b2c3
                      project: 71b7d9e6-f29a-46e0-9899-f0dd317403a7
                      project_title: Skyline Apartments
                      status: APPROVED
                      reason: Initial project evaluation
                      created_at: '2026-01-20T14:00:00Z'
                  summary: Access Request List Example
          description: ''
  /api/v1/admin/users/:
    get:
      operationId: admin_users_retrieve
      description: List all users
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/admin/users/{id}/:
    get:
      operationId: admin_users_retrieve_2
      description: Retrieve, Update, or Delete user (Admin only).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
    put:
      operationId: admin_users_update
      description: Retrieve, Update, or Delete user (Admin only).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminUserUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminUserUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserUpdate'
          description: ''
    patch:
      operationId: admin_users_partial_update
      description: Retrieve, Update, or Delete user (Admin only).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserUpdate'
          description: ''
    delete:
      operationId: admin_users_destroy
      description: Retrieve, Update, or Delete user (Admin only).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/users/{id}/deactivate/:
    post:
      operationId: admin_users_deactivate_create
      description: Deactivate user (Admin only).
      parameters:
