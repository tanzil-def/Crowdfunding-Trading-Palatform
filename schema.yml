openapi: 3.0.3
info:
  title: Crowdfunding Trading Platform API
  version: 1.0.0
  description: Share-based crowdfunding platform with role-based access control
paths:
  /api/v1/access-requests/:
    post:
      operationId: access_requests_create
      tags:
      - access-requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessRequestCreateRequest'
            examples:
              AccessRequestCreateExample:
                value:
                  project: 71b7d9e6-f29a-46e0-9899-f0dd317403a7
                  reason: I am an institutional investor looking for detailed financial
                    projections.
                summary: Access Request Create Example
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccessRequestCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccessRequestCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequestCreate'
              examples:
                AccessRequestCreateExample:
                  value:
                    project: 71b7d9e6-f29a-46e0-9899-f0dd317403a7
                    reason: I am an institutional investor looking for detailed financial
                      projections.
                  summary: Access Request Create Example
          description: ''
  /api/v1/access-requests/admin/:
    get:
      operationId: access_requests_admin_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - APPROVED
          - PENDING
          - REJECTED
          - REVOKED
        description: |-
          * `PENDING` - Pending
          * `APPROVED` - Approved
          * `REJECTED` - Rejected
          * `REVOKED` - Revoked
      tags:
      - access-requests
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminAccessRequestListList'
          description: ''
  /api/v1/access-requests/admin/{id}/approve/:
    post:
      operationId: access_requests_admin_approve_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - access-requests
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequestActionResponse'
          description: ''
  /api/v1/access-requests/admin/{id}/reject/:
